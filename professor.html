<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professor - Quem responde primeiro</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Arial, sans-serif; background:#0f172a; color:#f8fafc;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .sub { color:#94a3b8; margin-bottom:20px; text-align:center; }
  input { background:#1e293b; color:#f8fafc; border:1px solid #334155; border-radius:8px; padding:8px 10px; font-size:1rem; }
  .sub input { width:120px; padding:4px 8px; }
  .hidden { display:none !important; }

  /* Login */
  #loginBox { width:100%; max-width:360px; background:#1e293b; border-radius:16px; padding:24px; margin-top:40px; text-align:center; }
  #loginBox input { width:100%; margin-bottom:12px; }
  #loginErro { color:#f87171; min-height:24px; margin-top:8px; font-size:.95rem; }

  /* Painel */
  #display { width:100%; max-width:800px; min-height:220px; background:#1e293b; border-radius:20px;
             display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;
             font-size:2rem; margin-bottom:16px; }
  #display .big { font-size:9rem; font-weight:800; line-height:1; }
  #display .small { font-size:1.2rem; color:#94a3b8; margin-top:10px; }
  button { font-size:1.4rem; font-weight:700; padding:16px 32px; border:0; border-radius:12px;
           background:#22c55e; color:#052e16; cursor:pointer; }
  button:disabled { background:#475569; color:#94a3b8; cursor:not-allowed; }
  button.pequeno { font-size:.9rem; padding:6px 12px; background:#334155; color:#e2e8f0; }
  #loginBtn { width:100%; }
  #info { margin-top:20px; color:#94a3b8; text-align:center; max-width:800px; }
  #players { margin-top:8px; color:#cbd5e1; }
  a { color:#38bdf8; }
  #qr { display:inline-block; background:#fff; padding:12px; border-radius:12px; margin:12px 0 4px; cursor:zoom-in; }
  #qr.grande { cursor:zoom-out; }
  #qr img, #qr canvas { display:block; }
  .dica { font-size:.85rem; color:#64748b; }
  #topo { width:100%; max-width:800px; display:flex; justify-content:flex-end; margin-bottom:8px; }

  /* Ranking */
  #ranking { width:100%; max-width:800px; margin-bottom:16px; }
  .rank-item { display:flex; align-items:center; gap:12px; background:#1e293b; border-radius:12px;
               padding:10px 16px; margin-bottom:8px; font-size:1.2rem; }
  .rank-item .medalha { font-size:1.6rem; width:34px; text-align:center; }
  .rank-item .nome { font-weight:700; }
  .rank-item.ouro { background:#78350f; }
  .rank-item.ativo { background:#78350f; outline:2px solid #facc15; }
  .rank-item.passou { opacity:.4; text-decoration:line-through; }
  #proximoBtn { background:#ef4444; color:#fff; margin-top:10px; font-size:1.1rem; padding:10px 20px; }
  #proximoBtn:disabled { background:#475569; color:#94a3b8; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox" class="hidden">
  <h1>🔒 Área do Professor</h1>
  <p class="dica" style="margin-bottom:16px">Entre para controlar a contagem</p>
  <input id="email" type="email" placeholder="E-mail" autocomplete="username">
  <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
  <button id="loginBtn">Entrar</button>
  <div id="loginErro"></div>
</div>

<!-- PAINEL -->
<div id="painel" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
  <div id="topo"><button class="pequeno" id="sairBtn">Sair</button></div>
  <h1>Painel do Professor</h1>
  <div class="sub">
    Sala: <input id="salaInput" maxlength="30">
    <button id="salaBtn" class="pequeno">Trocar</button>
  </div>

  <div id="display"></div>
  <div id="ranking"></div>
  <button id="proximoBtn" class="hidden">❌ Errou, chamar próximo</button>
  <button id="startBtn">▶ Iniciar contagem</button>

  <div id="info">
    <div>Alunos: escaneiem para entrar</div>
    <div id="qr"></div>
    <div class="dica">Clique no QR Code para ampliar / reduzir</div>
    <div style="margin-top:10px">Ou acesse: <a id="linkAluno" target="_blank"></a></div>
    <div id="players"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Este bloco NÃO depende do Firebase (sala, link e QR Code)
(function () {
  var p = new URLSearchParams(location.search);
  var sala = (p.get("sala") || "turma1").replace(/[.#$\[\]\/]/g, "").slice(0, 30);
  var input = document.getElementById("salaInput");
  input.value = sala;
  function trocar() {
    var s = input.value.trim().replace(/[.#$\[\]\/]/g, "") || "turma1";
    location.href = location.pathname + "?sala=" + encodeURIComponent(s);
  }
  document.getElementById("salaBtn").addEventListener("click", trocar);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") trocar(); });

  var link = location.origin + location.pathname.replace(/[^\/]*$/, "aluno.html") + "?sala=" + encodeURIComponent(sala);
  if (location.protocol === "file:") link = "(publique no GitHub Pages para gerar o link)";
  var a = document.getElementById("linkAluno");
  a.href = link; a.textContent = link;

  var qrBox = document.getElementById("qr");
  function desenharQR(tamanho) {
    qrBox.innerHTML = "";
    new QRCode(qrBox, { text: link, width: tamanho, height: tamanho, correctLevel: QRCode.CorrectLevel.M });
  }
  if (location.protocol === "file:" || typeof QRCode === "undefined") {
    qrBox.style.display = "none";
  } else {
    var grande = false;
    desenharQR(200);
    qrBox.addEventListener("click", function () {
      grande = !grande;
      qrBox.classList.toggle("grande", grande);
      desenharQR(grande ? 380 : 200);
    });
  }
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig, getSala } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const sala = getSala();
const stateRef = ref(db, `salas/${sala}/state`);
const playersRef = ref(db, `salas/${sala}/players`);
const answersRef = ref(db, `salas/${sala}/answers`);

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const escapeHtml = t => String(t).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const MEDALHAS = ["🥇", "🥈", "🥉"];

let state = null;
let answersAll = null;
let running = false;
let listening = false;

/* ---------- LOGIN ---------- */
function mensagemErro(code) {
  switch (code) {
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found": return "E-mail ou senha incorretos.";
    case "auth/invalid-email": return "E-mail inválido.";
    case "auth/too-many-requests": return "Muitas tentativas. Aguarde alguns minutos.";
    case "auth/network-request-failed": return "Sem conexão com a internet.";
    case "auth/unauthorized-domain": return "Domínio não autorizado no Firebase (veja Authentication > Configurações > Domínios autorizados).";
    default: return "Não foi possível entrar (" + code + ").";
  }
}
async function entrar() {
  $("loginErro").textContent = "";
  $("loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("senha").value);
  } catch (e) {
    $("loginErro").textContent = mensagemErro(e.code);
  }
  $("loginBtn").disabled = false;
}
$("loginBtn").onclick = entrar;
$("senha").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
$("sairBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (user) {
    $("loginBox").classList.add("hidden");
    $("painel").classList.remove("hidden");
    iniciarPainel();
  } else {
    $("painel").classList.add("hidden");
    $("loginBox").classList.remove("hidden");
    $("senha").value = "";
  }
});

/* ---------- RANKING ---------- */
function topDaRodada() {
  if (!state || !answersAll) return [];
  const doRound = answersAll[state.round];
  if (!doRound) return [];
  return Object.values(doRound)
    .filter(v => v && typeof v.ts === "number")
    .sort((a, b) => a.ts - b.ts)
    .slice(0, 3);
}
function rankingHTML(top, activeIdx) {
  if (!top.length) return "";
  return top.map((r, i) => {
    const cls = i === activeIdx ? "ativo" : (i < activeIdx ? "passou" : "");
    return `<div class="rank-item ${cls}">
       <span class="medalha">${MEDALHAS[i]}</span>
       <span class="nome">${escapeHtml(r.name)}</span>
     </div>`;
  }).join("");
}

/* ---------- PAINEL ---------- */
function render() {
  const d = $("display");
  const s = state || { status: "idle" };
  const top = topDaRodada();
  const revealIdx = (s.reveal) || 0;

  if (s.status === "idle") {
    d.innerHTML = `<div>Faça sua pergunta oral para a turma e<br>clique em <b>Iniciar contagem</b>.</div>`;
  } else if (s.status === "countdown") {
    d.innerHTML = `<div class="big">${s.count}</div>`;
  } else if (s.status === "open") {
    d.innerHTML = top.length
      ? `<div class="small">Respondendo agora:<br><b style="font-size:1.6rem;color:#facc15">${escapeHtml((top[revealIdx] || {}).name || "-")}</b></div>`
      : `<div><div class="big" style="color:#22c55e">JÁ!</div><div class="small">Aguardando o primeiro aluno...</div></div>`;
  }
  $("ranking").innerHTML = rankingHTML(top, revealIdx);

  const temProximo = s.status === "open" && top.length > revealIdx + 1;
  $("proximoBtn").classList.toggle("hidden", s.status !== "open" || top.length === 0);
  $("proximoBtn").disabled = !temProximo;
  $("proximoBtn").textContent = temProximo ? "❌ Errou, chamar próximo" : "❌ Não há mais respostas";

  $("startBtn").disabled = running || s.status === "countdown";
  $("startBtn").textContent = (s.status === "open" && top.length) ? "▶ Nova pergunta" : "▶ Iniciar contagem";
}

function iniciarPainel() {
  if (listening) return;
  listening = true;
  onValue(stateRef, snap => { state = snap.val(); render(); });
  onValue(answersRef, snap => { answersAll = snap.val(); render(); });
  onValue(playersRef, snap => {
    const p = snap.val() || {};
    const nomes = Object.values(p).map(x => escapeHtml(x.name));
    $("players").innerHTML = `👥 ${nomes.length} aluno(s) conectado(s)` + (nomes.length ? `: ${nomes.join(", ")}` : "");
  });
  render();
}

// Iniciar contagem 3, 2, 1 (só funciona com o professor logado, garantido pelas regras)
$("startBtn").onclick = async () => {
  if (running) return;
  running = true; render();
  try {
    const round = ((state && state.round) || 0) + 1;
    await set(stateRef, { status: "countdown", count: 3, round, reveal: 0 });
    await sleep(1000);
    await set(stateRef, { status: "countdown", count: 2, round, reveal: 0 });
    await sleep(1000);
    await set(stateRef, { status: "countdown", count: 1, round, reveal: 0 });
    await sleep(1000);
    await set(stateRef, { status: "open", count: 0, round, reveal: 0 });
  } catch (e) {
    alert("Erro ao iniciar: " + e.message + "\nVerifique as permissões nas regras do banco de dados.");
  }
  running = false;
  render();
};

// Marca a resposta atual como errada e chama o próximo colocado
let avancando = false;
$("proximoBtn").onclick = async () => {
  if (avancando || !state) return;
  const top = topDaRodada();
  const idx = state.reveal || 0;
  if (top.length <= idx + 1) return;
  avancando = true;
  try {
    await update(stateRef, { reveal: idx + 1 });
  } catch (e) {
    alert("Erro ao chamar o próximo: " + e.message);
  }
  avancando = false;
};
</script>
</body>
</html>
